<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIGift · 礼物推荐小程序原型</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,500&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 桌面舞台：品牌 + 手机框 -->
  <div class="stage">
    <!-- 漂浮的品牌信息 -->
    <aside class="stage__meta">
      <div class="brandword">
        <span class="brandword__ai">AI</span><span class="brandword__gift">Gift</span>
      </div>
      <p class="brandword__tag">礼物推荐 · 高保真原型</p>
      <p class="brandword__hint">基于 PRD v1.0 构建 · 微信小程序体验模拟</p>
    </aside>

    <!-- 手机 -->
    <div class="phone">
      <div class="phone__island"></div>
      <div class="phone__screen">
        <!-- 状态栏 -->
        <div class="statusbar">
          <span class="statusbar__time" id="statusTime">9:41</span>
          <span class="statusbar__icons">
            <svg viewBox="0 0 20 12" class="ico-signal"><path d="M1 9h2v2H1zM5 7h2v4H5zM9 5h2v6H9zM13 3h2v8h-2zM17 1h2v10h-2z" fill="currentColor"/></svg>
            <svg viewBox="0 0 16 12" class="ico-wifi"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l-1.4 1.4A6.5 6.5 0 008 4.5 6.5 6.5 0 003.4 6.3L2 4.9A8.5 8.5 0 018 2.5zm0 3c1.5 0 2.9.6 3.9 1.6l-1.4 1.4A3.5 3.5 0 008 7.5c-.9 0-1.8.4-2.5 1L4 7.1A4.95 4.95 0 018 5.5zm0 3c.8 0 1.5.3 2 .8L8 11.3 6 9.3c.5-.5 1.2-.8 2-.8z" fill="currentColor"/></svg>
            <svg viewBox="0 0 26 12" class="ico-batt"><rect x="0.5" y="0.5" width="22" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="23.5" y="3.5" width="2" height="5" rx="1" fill="currentColor"/><rect x="2" y="2" width="17" height="8" rx="1.5" fill="currentColor"/></svg>
          </span>
        </div>

        <!-- 小程序导航条 -->
        <div class="navhead">
          <div class="navhead__capsule">
            <svg viewBox="0 0 24 24" class="cap-ico"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="cap-div"></span>
            <svg viewBox="0 0 24 24" class="cap-ico"><circle cx="5" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="19" cy="12" r="1.6" fill="currentColor"/></svg>
          </div>
          <div class="navhead__title" id="navTitle">礼物推荐</div>
          <div class="navhead__spacer"></div>
        </div>

        <!-- 屏幕容器 -->
        <main class="app" id="app">
          <div class="screens">
            <section class="screen" data-screen="recommend" data-title="礼物推荐"></section>
            <section class="screen" data-screen="recipients" data-title="送礼对象"></section>
            <section class="screen" data-screen="history" data-title="推荐历史"></section>
            <section class="screen" data-screen="profile" data-title="我的"></section>
            <!-- 结果页（覆盖层，无 tab） -->
            <section class="screen screen--overlay" data-screen="result" data-title="推荐结果"></section>
          </div>

          <!-- tabBar -->
          <nav class="tabbar">
            <button class="tab" data-tab="recommend" data-active="true">
              <svg viewBox="0 0 24 24" class="tab__ico"><path d="M12 3l2.09 4.26L19 8.27l-3 3.17.71 4.56L12 14.77l-4.71 1.23L8 11.44l-3-3.17 4.91-1.01L12 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
              <span>推荐</span>
            </button>
            <button class="tab" data-tab="recipients">
              <svg viewBox="0 0 24 24" class="tab__ico"><path d="M16 11a4 4 0 10-4-4 4 4 0 004 4zm-8 1a3 3 0 10-3-3 3 3 0 003 3zm0 2c-2.7 0-6 1.34-6 4v2h7v-2c0-1.5.6-2.8 1.6-3.7A9.6 9.6 0 008 14zm8 0c-.9 0-1.95.2-2.9.6 1.3 1 1.9 2.3 1.9 3.4v2H22v-2c0-2.66-3.3-4-6-4z" fill="currentColor"/></svg>
              <span>对象</span>
            </button>
            <button class="tab" data-tab="history">
              <svg viewBox="0 0 24 24" class="tab__ico"><path d="M13 3a9 9 0 109 9h-2a7 7 0 11-7-7v2l4-3.5L13 1v2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 7v5l4 2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              <span>历史</span>
            </button>
            <button class="tab" data-tab="profile">
              <svg viewBox="0 0 24 24" class="tab__ico"><path d="M12 12a4.5 4.5 0 10-4.5-4.5A4.5 4.5 0 0012 12zm0 2c-4 0-8 2-8 6v1h16v-1c0-4-4-6-8-6z" fill="currentColor"/></svg>
              <span>我的</span>
            </button>
          </nav>

          <!-- 模态层 -->
          <div class="modal-layer" id="modalLayer" aria-hidden="true"></div>
          <!-- toast -->
          <div class="toast" id="toast" aria-live="polite"></div>
          <!-- 全屏 loading -->
          <div class="loader" id="loader" aria-hidden="true">
            <div class="loader__inner">
              <div class="seal seal--lg loader__seal">
                <span class="seal__num">AI</span>
              </div>
              <p class="loader__text">正在为你挑选礼物…</p>
              <div class="loader__bar"><i></i></div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <aside class="stage__legend">
      <p class="legend__cap">提示</p>
      <ul class="legend__list">
        <li>填写信息越多，推荐越准（留意<b>完整度</b>）</li>
        <li>额度用完可<b>看激励视频</b>或<b>分享</b>补充</li>
        <li>点击底部 tab 切换：推荐 / 对象 / 历史 / 我的</li>
      </ul>
    </aside>
  </div>

  <!-- 纸纹纹理（SVG noise） -->
  <svg class="grain" aria-hidden="true">
    <filter id="paperNoise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <rect width="100%" height="100%" filter="url(#paperNoise)"/>
  </svg>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
