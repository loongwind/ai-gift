<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AIGift · AI 礼物推荐（单文件版）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,800;0,9..144,900;1,9..144,500&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" rel="stylesheet" />
  <style>
/* ============================================================
   AIGift 原型 · Gift Atelier 暖色策展风
   ============================================================ */

/* ---------- 设计令牌 ---------- */
:root {
  --paper:      #FAF4E8;
  --paper-2:    #F3EAD6;
  --paper-3:    #EADFC6;
  --ink:        #2B231E;
  --ink-2:      #5C5147;
  --ink-3:      #8E8275;
  --rose:       #B23A4E;
  --rose-d:     #8C2838;
  --rose-l:     #E9C7CD;
  --rose-bg:    #FBEDF0;
  --gold:       #BE933A;
  --gold-d:     #9A7322;
  --gold-l:     #E6D29A;
  --gold-bg:    #F7F0D9;
  --sage:       #7E906F;
  --sage-bg:    #E9EEE2;
  --terra:      #C77A57;
  --terra-bg:   #F6E4D9;
  --line:       #E6DAC4;
  --line-2:     #D6C7AA;
  --sh: 92, 62, 40;

  --ff-display: "Fraunces", "Noto Serif SC", Georgia, serif;
  --ff-serif:   "Noto Serif SC", Georgia, serif;
  --ff-body:    "Noto Sans SC", -apple-system, "PingFang SC", sans-serif;
  --ff-hand:    "LXGW WenKai", "Noto Serif SC", serif;

  --r-sm: 10px; --r-md: 16px; --r-lg: 22px; --r-xl: 30px;
  --ease: cubic-bezier(.22,.61,.36,1);
}

/* ---------- 基础重置 ---------- */
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: var(--ff-body);
  color: var(--ink);
  background: #E7D9BE;
  background-image:
    radial-gradient(120% 80% at 12% 0%, #F4E6C6 0%, transparent 55%),
    radial-gradient(120% 90% at 100% 100%, #E3C9A0 0%, transparent 55%),
    linear-gradient(135deg, #EBDCBE 0%, #DCc8a0 100%);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  letter-spacing: .01em;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }
svg { display: block; }

/* 纸纹颗粒 */
.grain {
  position: fixed; inset: 0; width: 100%; height: 100%;
  opacity: .05; pointer-events: none; z-index: 9999; mix-blend-mode: multiply;
}

/* ============================================================
   桌面舞台
   ============================================================ */
.stage {
  position: relative;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 56px;
  width: 100%; max-width: 1320px;
  padding: 40px;
}
.stage__meta, .stage__legend { align-self: center; }
.stage__meta { justify-self: end; text-align: right; max-width: 280px; }
.stage__legend { justify-self: start; max-width: 240px; }

.brandword {
  font-family: var(--ff-display);
  font-weight: 900;
  font-size: 62px;
  line-height: .95;
  letter-spacing: -.03em;
}
.brandword__ai { color: var(--rose); }
.brandword__gift { color: var(--ink); }
.brandword__tag {
  margin-top: 14px;
  font-family: var(--ff-serif);
  font-weight: 700;
  font-size: 19px;
  color: var(--ink);
}
.brandword__hint {
  margin-top: 6px;
  font-size: 12.5px;
  color: var(--ink-3);
  letter-spacing: .03em;
}

.legend__cap {
  font-family: var(--ff-display);
  font-style: italic;
  font-weight: 500;
  font-size: 14px;
  color: var(--gold-d);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line-2);
}
.legend__list { list-style: none; }
.legend__list li {
  position: relative;
  font-size: 13px;
  line-height: 1.65;
  color: var(--ink-2);
  padding-left: 18px;
  margin-bottom: 12px;
}
.legend__list li::before {
  content: ""; position: absolute; left: 0; top: 8px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--rose);
  box-shadow: 0 0 0 3px var(--rose-bg);
}
.legend__list b { color: var(--ink); font-weight: 700; }

/* 装饰：缎带曲线 */
.stage::before, .stage::after {
  content: ""; position: absolute; pointer-events: none;
  width: 320px; height: 320px; border-radius: 50%;
  filter: blur(8px); opacity: .4;
}
.stage::before {
  left: -80px; top: -60px;
  background: radial-gradient(circle, var(--rose-l), transparent 70%);
}
.stage::after {
  right: -80px; bottom: -80px;
  background: radial-gradient(circle, var(--gold-l), transparent 70%);
}

/* ============================================================
   手机外框
   ============================================================ */
.phone {
  position: relative;
  width: 392px;
  height: min(830px, 94vh);
  background: linear-gradient(160deg, #2b2620, #16120e);
  border-radius: 50px;
  padding: 11px;
  box-shadow:
    0 2px 0 1px rgba(255,255,255,.05) inset,
    0 0 0 1.5px rgba(0,0,0,.4),
    0 40px 80px -20px rgba(var(--sh),.55),
    0 18px 40px -12px rgba(var(--sh),.4);
  flex-shrink: 0;
}
.phone__island {
  position: absolute;
  top: 20px; left: 50%; transform: translateX(-50%);
  width: 104px; height: 30px;
  background: #000; border-radius: 20px;
  z-index: 60;
}
.phone__screen {
  position: relative;
  width: 100%; height: 100%;
  background: var(--paper);
  border-radius: 40px;
  overflow: hidden;
  display: flex; flex-direction: column;
}

/* 状态栏 */
.statusbar {
  height: 46px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 30px 0;
  color: var(--ink);
  position: relative; z-index: 50;
}
.statusbar__time {
  font-family: var(--ff-display);
  font-weight: 700;
  font-size: 15px;
  letter-spacing: .02em;
  margin-left: 4px;
}
.statusbar__icons { display: flex; align-items: center; gap: 6px; }
.statusbar__icons svg { width: 17px; height: 12px; }

/* 导航条 */
.navhead {
  height: 44px; flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 0 14px;
  position: relative; z-index: 40;
  border-bottom: .5px solid var(--line);
  background: var(--paper);
}
.navhead__capsule {
  display: flex; align-items: center; gap: 4px;
  height: 32px; padding: 0 10px;
  border: .5px solid var(--line-2);
  border-radius: 16px;
  background: rgba(255,255,255,.4);
  box-shadow: 0 1px 2px rgba(var(--sh),.05);
}
.cap-ico { width: 17px; height: 17px; color: var(--ink-2); }
.cap-div { width: .5px; height: 14px; background: var(--line-2); }
.navhead__title {
  flex: 1; text-align: center;
  font-family: var(--ff-serif);
  font-weight: 700;
  font-size: 16px;
  color: var(--ink);
  margin-right: 64px;
}
.navhead__spacer { width: 64px; }

/* ============================================================
   应用主体 / 屏幕
   ============================================================ */
.app { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
.screens { flex: 1; position: relative; min-height: 0; }

.screen {
  position: absolute; inset: 0;
  overflow-y: auto; overflow-x: hidden;
  padding: 18px 18px 132px;
  opacity: 0; visibility: hidden;
  transform: translateY(8px);
  transition: opacity .3s var(--ease), transform .3s var(--ease), visibility .3s;
  -webkit-overflow-scrolling: touch;
}
.screen.is-active { opacity: 1; visibility: visible; transform: none; }
.screen::-webkit-scrollbar { width: 0; }

.screen--overlay {
  z-index: 30;
  background: var(--paper);
  transform: translateY(100%);
  transition: transform .42s var(--ease), opacity .3s var(--ease);
  padding-bottom: 120px;
}
.screen--overlay.is-active { transform: none; opacity: 1; }

/* tabBar */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 68px;
  display: flex;
  background: rgba(250,244,232,.92);
  backdrop-filter: blur(14px);
  border-top: .5px solid var(--line);
  z-index: 45;
  padding-bottom: 4px;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px;
  color: var(--ink-3);
  transition: color .2s var(--ease);
  position: relative;
}
.tab__ico { width: 24px; height: 24px; transition: transform .25s var(--ease); }
.tab span { font-size: 11px; font-weight: 500; letter-spacing: .02em; }
.tab[data-active="true"] { color: var(--rose); }
.tab[data-active="true"] .tab__ico { transform: translateY(-2px) scale(1.08); }
.tab[data-active="true"]::before {
  content: ""; position: absolute; top: 0;
  width: 22px; height: 3px; border-radius: 0 0 3px 3px;
  background: var(--rose);
}

/* ============================================================
   排版与通用组件
   ============================================================ */
.h-eyebrow {
  font-family: var(--ff-display);
  font-style: italic; font-weight: 500;
  font-size: 12.5px; color: var(--gold-d);
  letter-spacing: .04em;
}
.h-title {
  font-family: var(--ff-serif);
  font-weight: 900; font-size: 22px;
  color: var(--ink); letter-spacing: .01em;
  line-height: 1.25;
}
.h-sub { font-size: 13px; color: var(--ink-2); line-height: 1.5; }

.section { margin-top: 22px; }
.section__head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin-bottom: 12px;
}
.section__head .h-title { font-size: 17px; }
.section__head .link { font-size: 12.5px; color: var(--rose); font-weight: 500; }

.num { font-family: var(--ff-display); font-weight: 800; font-variant-numeric: tabular-nums; }

/* 卡片 */
.card {
  background: #FFFBF1;
  border: .5px solid var(--line);
  border-radius: var(--r-md);
  box-shadow: 0 2px 10px -4px rgba(var(--sh),.12);
}
.card--pad { padding: 16px; }

/* 主按钮 */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 22px;
  border-radius: 14px;
  font-weight: 700; font-size: 15.5px;
  letter-spacing: .02em;
  transition: transform .15s var(--ease), box-shadow .2s var(--ease), opacity .2s;
}
.btn--primary {
  background: linear-gradient(180deg, var(--rose), var(--rose-d));
  color: #fff;
  box-shadow: 0 10px 22px -8px rgba(178,58,78,.65), 0 1px 0 rgba(255,255,255,.25) inset;
}
.btn--primary:active { transform: scale(.98); }
.btn--primary[disabled] {
  background: var(--paper-3); color: var(--ink-3);
  box-shadow: none; cursor: not-allowed;
}
.btn--ghost {
  background: rgba(255,255,255,.5); color: var(--ink);
  border: .5px solid var(--line-2);
}
.btn--gold {
  background: linear-gradient(180deg, var(--gold), var(--gold-d));
  color: #fff;
  box-shadow: 0 10px 22px -8px rgba(190,147,58,.55);
}
.btn--block { width: 100%; }
.btn--sm { height: 34px; padding: 0 14px; font-size: 13px; border-radius: 10px; }

/* 图标默认尺寸兜底（防止无尺寸 SVG 撑坏容器） */
.btn svg { width: 18px; height: 18px; flex-shrink: 0; }
.btn--sm svg { width: 15px; height: 15px; }
.reward__countdown svg { width: 14px; height: 14px; }
.reward__seal svg { width: 34px; height: 34px; }
.sheet svg { flex-shrink: 0; }

/* ============================================================
   推荐首页
   ============================================================ */
.hero {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 4px;
}
.hero__greet { font-size: 13px; color: var(--ink-3); }
.hero__greet b { color: var(--ink); font-weight: 700; }

/* 额度条 */
.quota {
  margin-top: 14px;
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px;
  border-radius: var(--r-md);
  background: linear-gradient(105deg, var(--rose-bg), var(--gold-bg));
  border: .5px solid var(--rose-l);
}
.quota__icon {
  width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
  background: linear-gradient(180deg, var(--rose), var(--rose-d));
  display: grid; place-items: center; color: #fff;
  box-shadow: 0 4px 10px -3px rgba(178,58,78,.5);
}
.quota__icon svg { width: 20px; height: 20px; }
.quota__txt { flex: 1; }
.quota__num {
  font-family: var(--ff-display); font-weight: 800;
  font-size: 22px; color: var(--rose-d); line-height: 1;
}
.quota__num small { font-size: 12px; font-weight: 600; color: var(--ink-2); margin-left: 3px; }
.quota__label { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
.quota__add {
  flex-shrink: 0; height: 32px; padding: 0 12px;
  border-radius: 10px; font-size: 12px; font-weight: 700;
  background: var(--ink); color: var(--paper);
  display: flex; align-items: center; gap: 4px;
}
.quota__add svg { width: 14px; height: 14px; }

/* 对象选择横滑 */
.recipient-rail { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 8px; }
.recipient-rail::-webkit-scrollbar { display: none; }
.rchip {
  flex-shrink: 0; width: 92px;
  padding: 12px 8px;
  border-radius: var(--r-md);
  background: #FFFBF1;
  border: 1.5px solid var(--line);
  text-align: center;
  transition: all .2s var(--ease);
  position: relative;
}
.rchip__avatar {
  width: 46px; height: 46px; border-radius: 50%;
  margin: 0 auto 8px;
  display: grid; place-items: center;
  font-family: var(--ff-serif); font-weight: 700; font-size: 18px;
  color: #fff;
}
.rchip__name { font-size: 12.5px; font-weight: 600; color: var(--ink); }
.rchip__rel { font-size: 10.5px; color: var(--ink-3); margin-top: 2px; }
.rchip[data-active="true"] {
  border-color: var(--rose);
  background: var(--rose-bg);
  box-shadow: 0 6px 14px -6px rgba(178,58,78,.4);
}
.rchip[data-active="true"]::after {
  content: ""; position: absolute; top: 6px; right: 6px;
  width: 8px; height: 8px; border-radius: 50%; background: var(--rose);
}
.rchip--add {
  border-style: dashed; border-color: var(--line-2);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--ink-3);
}
.rchip--add svg { width: 22px; height: 22px; margin-bottom: 4px; }

/* 场景模板 */
.tmpl-rail { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
.tmpl-rail::-webkit-scrollbar { display: none; }
.tmpl {
  flex-shrink: 0; padding: 8px 14px;
  border-radius: 20px;
  background: #FFFBF1; border: .5px solid var(--line);
  font-size: 12.5px; font-weight: 500; color: var(--ink-2);
  display: flex; align-items: center; gap: 5px;
  transition: all .2s var(--ease);
}
.tmpl svg { width: 14px; height: 14px; }
.tmpl[data-active="true"] {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}
.tmpl[data-active="true"] svg { color: var(--gold-l); }

/* 表单组 */
.field { margin-bottom: 14px; }
.field__label {
  display: flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 700; color: var(--ink);
  margin-bottom: 8px;
}
.field__label .req { color: var(--rose); font-size: 13px; }
.field__label .opt {
  font-family: var(--ff-display); font-style: italic; font-weight: 500;
  font-size: 10.5px; color: var(--gold-d);
  margin-left: auto;
}
.seg {
  display: flex; flex-wrap: wrap; gap: 7px;
}
.seg__btn {
  padding: 7px 13px; border-radius: 9px;
  background: var(--paper-2); border: .5px solid var(--line);
  font-size: 12.5px; color: var(--ink-2); font-weight: 500;
  transition: all .18s var(--ease);
}
.seg__btn[data-active="true"] {
  background: var(--ink); color: var(--paper); border-color: var(--ink);
}
.seg--multi .seg__btn[data-active="true"] {
  background: var(--rose-bg); color: var(--rose-d); border-color: var(--rose-l);
}
.seg__btn .check {
  display: inline-block; width: 11px; height: 11px;
  vertical-align: -1px; margin-right: 3px; opacity: 0;
  transition: opacity .15s;
}
.seg--multi .seg__btn[data-active="true"] .check { opacity: 1; }

.input, .textarea {
  width: 100%; padding: 11px 13px;
  border-radius: 10px;
  background: var(--paper-2);
  border: .5px solid var(--line);
  font-size: 13.5px; color: var(--ink);
  transition: border-color .2s, background .2s;
}
.input::placeholder, .textarea::placeholder { color: var(--ink-3); }
.input:focus, .textarea:focus {
  outline: none; border-color: var(--rose); background: #FFFBF1;
}
.textarea { resize: none; min-height: 60px; line-height: 1.5; }

.range {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px;
  border-radius: 10px; background: var(--paper-2);
  border: .5px solid var(--line);
}
.range__val { font-family: var(--ff-display); font-weight: 800; font-size: 16px; color: var(--rose-d); min-width: 86px; }
.range input[type=range] {
  flex: 1; -webkit-appearance: none; appearance: none;
  height: 4px; border-radius: 4px;
  background: linear-gradient(90deg, var(--rose) var(--p,40%), var(--line-2) var(--p,40%));
}
.range input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; border: 3px solid var(--rose);
  box-shadow: 0 2px 6px -1px rgba(var(--sh),.4);
}

/* 完整度 */
.completeness {
  position: sticky; top: -18px; z-index: 5;
  margin: -18px -18px 14px;
  padding: 14px 18px 12px;
  background: linear-gradient(180deg, var(--paper) 70%, rgba(250,244,232,0));
}
.comp__top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; }
.comp__label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
.comp__label svg { width: 14px; height: 14px; color: var(--gold); }
.comp__pct { font-family: var(--ff-display); font-weight: 800; font-size: 18px; color: var(--ink); }
.comp__bar { height: 7px; border-radius: 6px; background: var(--paper-3); overflow: hidden; }
.comp__fill {
  height: 100%; border-radius: 6px;
  background: linear-gradient(90deg, var(--gold), var(--rose));
  width: 0; transition: width .5s var(--ease);
}
.comp__hint {
  margin-top: 8px; font-size: 11.5px; color: var(--ink-2);
  display: flex; align-items: center; gap: 5px;
}
.comp__badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 9px; border-radius: 10px;
  font-size: 11px; font-weight: 700;
  background: var(--paper-3); color: var(--ink-2);
  transition: all .3s var(--ease);
}
.comp__badge[data-tier="1"] { background: var(--gold-bg); color: var(--gold-d); }
.comp__badge[data-tier="2"] { background: var(--rose-bg); color: var(--rose-d); }
.comp__badge .dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* 广告位 */
.adslot {
  margin: 16px 0;
  height: 64px; border-radius: var(--r-md);
  background: repeating-linear-gradient(135deg, var(--paper-3) 0 10px, var(--paper-2) 10px 20px);
  border: .5px dashed var(--line-2);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--ink-3); font-size: 11.5px; letter-spacing: .05em;
}
.adslot svg { width: 14px; height: 14px; }
.adslot--banner { height: 56px; }

/* 生成按钮浮层 */
.generate-dock {
  position: absolute; left: 0; right: 0; bottom: 68px;
  padding: 10px 18px 14px;
  background: linear-gradient(180deg, rgba(250,244,232,0), var(--paper) 35%);
  z-index: 8;
}

/* ============================================================
   印章式匹配分
   ============================================================ */
.seal {
  position: relative;
  width: 54px; height: 54px; flex-shrink: 0;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, var(--gold-l), var(--gold) 70%, var(--gold-d));
  display: grid; place-items: center;
  box-shadow:
    0 0 0 2px var(--paper),
    0 0 0 3.5px var(--gold-d),
    0 6px 12px -4px rgba(154,115,34,.6);
  transform: rotate(-8deg);
}
.seal::before {
  content: ""; position: absolute; inset: 4px;
  border: 1px dashed rgba(255,255,255,.55);
  border-radius: 50%;
}
.seal__num {
  font-family: var(--ff-display); font-weight: 900;
  font-size: 20px; color: #fff;
  line-height: 1; text-shadow: 0 1px 0 rgba(0,0,0,.15);
  display: flex; align-items: baseline; justify-content: center;
}
.seal__num small { font-size: 10px; font-weight: 700; }
.seal__num svg, .seal > svg { width: 1em; height: 1em; }
.seal--lg { width: 86px; height: 86px; transform: none; }
.seal--lg .seal__num { font-size: 32px; }
.seal--rose {
  background: radial-gradient(circle at 35% 30%, var(--rose-l), var(--rose) 70%, var(--rose-d));
  box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--rose-d), 0 6px 12px -4px rgba(140,40,56,.6);
}
.seal--press { animation: sealPress .5s var(--ease); }

/* ============================================================
   推荐结果卡片
   ============================================================ */
.result-head { text-align: center; padding: 6px 0 16px; }
.result-head .seal { margin: 0 auto 12px; }
.result-head__title { font-family: var(--ff-serif); font-weight: 900; font-size: 20px; }
.result-head__sub { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; }

.gift-card {
  position: relative;
  background: #FFFBF1;
  border: .5px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: 0 4px 16px -8px rgba(var(--sh),.2);
  animation: cardRise .5s var(--ease) both;
}
.gift-card__top { display: flex; gap: 14px; align-items: flex-start; }
.gift-card__main { flex: 1; min-width: 0; }
.gift-card__name {
  font-family: var(--ff-serif); font-weight: 700; font-size: 17px;
  color: var(--ink); line-height: 1.3;
}
.gift-card__price {
  margin-top: 5px;
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--ff-display); font-weight: 700; font-size: 14px;
  color: var(--rose-d);
}
.gift-card__price svg { width: 13px; height: 13px; }
.gift-card__tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
.tag {
  padding: 2px 8px; border-radius: 6px;
  font-size: 10.5px; font-weight: 500;
}
.tag--sage { background: var(--sage-bg); color: var(--sage); }
.tag--gold { background: var(--gold-bg); color: var(--gold-d); }
.tag--terra { background: var(--terra-bg); color: var(--terra); }

/* 手写便签：推荐理由 */
.note {
  position: relative;
  margin-top: 14px;
  padding: 14px 14px 12px 16px;
  background: linear-gradient(180deg, #FFF6E0, #FCEED0);
  border-radius: 4px 14px 14px 14px;
  transform: rotate(-.4deg);
  box-shadow: 0 3px 8px -4px rgba(var(--sh),.25);
}
.note::before {
  content: ""; position: absolute; top: -7px; left: 18px;
  width: 38px; height: 14px;
  background: rgba(178,58,78,.18);
  transform: rotate(-3deg);
  border-radius: 2px;
}
.note__label {
  font-family: var(--ff-display); font-style: italic; font-weight: 500;
  font-size: 11px; color: var(--gold-d); margin-bottom: 5px;
}
.note__txt {
  font-family: var(--ff-hand);
  font-size: 14px; line-height: 1.7; color: var(--ink);
}
.note__hint {
  margin-top: 8px; font-size: 11px; color: var(--ink-3);
  display: flex; align-items: center; gap: 5px;
}
.note__hint svg { width: 12px; height: 12px; color: var(--terra); }

.gift-card__actions {
  display: flex; gap: 8px; margin-top: 14px;
  padding-top: 14px; border-top: 1px dashed var(--line);
}
.gact {
  flex: 1; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  font-size: 12.5px; font-weight: 600;
  background: var(--paper-2); color: var(--ink-2);
  border: .5px solid var(--line);
  transition: all .18s var(--ease);
}
.gact svg { width: 15px; height: 15px; }
.gact[data-on="true"] { background: var(--sage-bg); color: var(--sage); border-color: var(--sage); }
.gact--reject[data-on="true"] { background: var(--terra-bg); color: var(--terra); border-color: var(--terra); }
.gact--save { flex: 0 0 44px; }
.gact--save[data-on="true"] { color: var(--gold-d); background: var(--gold-bg); border-color: var(--gold-l); }

.gift-card[data-status="accepted"] { border-color: var(--sage); background: #FAFCF6; }
.gift-card[data-status="rejected"] { opacity: .55; }

/* ============================================================
   对象 / 历史 / 我的 列表
   ============================================================ */
.list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px;
  background: #FFFBF1; border: .5px solid var(--line);
  border-radius: var(--r-md); margin-bottom: 10px;
  box-shadow: 0 2px 8px -4px rgba(var(--sh),.1);
}
.avatar {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  display: grid; place-items: center;
  font-family: var(--ff-serif); font-weight: 700; font-size: 18px; color: #fff;
}
.avatar--lg { width: 64px; height: 64px; font-size: 24px; }
.list-item__main { flex: 1; min-width: 0; }
.list-item__name { font-weight: 700; font-size: 14.5px; color: var(--ink); }
.list-item__meta { font-size: 12px; color: var(--ink-3); margin-top: 3px; }
.list-item__end { flex-shrink: 0; text-align: right; }
.list-item__end .num { font-size: 16px; color: var(--rose-d); }

.hist-group__label {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--ff-serif); font-weight: 700; font-size: 13px;
  color: var(--ink-2); margin: 18px 0 10px;
}
.hist-group__label::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.hist-card {
  padding: 14px; background: #FFFBF1; border: .5px solid var(--line);
  border-radius: var(--r-md); margin-bottom: 10px;
}
.hist-card__top { display: flex; justify-content: space-between; align-items: baseline; }
.hist-card__who { font-weight: 700; font-size: 14px; }
.hist-card__date { font-size: 11.5px; color: var(--ink-3); font-family: var(--ff-display); }
.hist-card__items { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.hist-item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
.hist-item__dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.hist-item__dot[data-s="accepted"] { background: var(--sage); }
.hist-item__dot[data-s="rejected"] { background: var(--terra); }
.hist-item__dot[data-s="pending"] { background: var(--line-2); }

/* 我的 */
.profile-head {
  text-align: center; padding: 8px 0 4px;
}
.profile-head .avatar { margin: 0 auto 12px; }
.profile-head__name { font-family: var(--ff-serif); font-weight: 700; font-size: 18px; }
.profile-head__id { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; font-family: var(--ff-display); }

.stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; margin: 16px 0; }
.stat {
  text-align: center; padding: 12px 6px;
  background: #FFFBF1; border: .5px solid var(--line); border-radius: var(--r-md);
}
.stat__num { font-family: var(--ff-display); font-weight: 800; font-size: 22px; color: var(--ink); }
.stat__num.rose { color: var(--rose-d); }
.stat__num.gold { color: var(--gold-d); }
.stat__label { font-size: 11px; color: var(--ink-3); margin-top: 3px; }

.flow-item {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 0; border-bottom: .5px dashed var(--line);
}
.flow-item:last-child { border-bottom: none; }
.flow-item__ico {
  width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
  display: grid; place-items: center;
}
.flow-item__ico svg { width: 16px; height: 16px; }
.flow-item__ico[data-t="add"] { background: var(--sage-bg); color: var(--sage); }
.flow-item__ico[data-t="use"] { background: var(--rose-bg); color: var(--rose-d); }
.flow-item__main { flex: 1; }
.flow-item__title { font-size: 13px; font-weight: 600; }
.flow-item__time { font-size: 11px; color: var(--ink-3); }
.flow-item__amt { font-family: var(--ff-display); font-weight: 700; font-size: 14px; }
.flow-item__amt.up { color: var(--sage); }
.flow-item__amt.down { color: var(--rose-d); }

.menu-row {
  display: flex; align-items: center; gap: 12px;
  padding: 14px; background: #FFFBF1; border: .5px solid var(--line);
  border-radius: var(--r-md); margin-bottom: 8px;
}
.menu-row__ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.menu-row__ico svg { width: 16px; height: 16px; color: #fff; }
.menu-row__title { flex: 1; font-size: 14px; font-weight: 500; }
.menu-row__arrow { color: var(--ink-3); }
.menu-row__arrow svg { width: 16px; height: 16px; }

/* ============================================================
   模态 / Toast / Loader
   ============================================================ */
.modal-layer {
  position: absolute; inset: 0; z-index: 80;
  display: none;
  background: rgba(30,22,16,.5);
  backdrop-filter: blur(3px);
  align-items: flex-end;
}
.modal-layer.is-open { display: flex; animation: fade .25s var(--ease); }
.sheet {
  width: 100%;
  background: var(--paper);
  border-radius: 26px 26px 0 0;
  padding: 8px 18px 30px;
  max-height: 85%; overflow-y: auto;
  animation: sheetUp .35s var(--ease);
  box-shadow: 0 -10px 30px -10px rgba(0,0,0,.3);
}
.sheet__handle { width: 38px; height: 4px; border-radius: 4px; background: var(--line-2); margin: 0 auto 16px; }
.sheet__title { font-family: var(--ff-serif); font-weight: 700; font-size: 17px; text-align: center; margin-bottom: 4px; }
.sheet__sub { font-size: 12.5px; color: var(--ink-2); text-align: center; margin-bottom: 18px; }

.reward {
  text-align: center; padding: 10px 0 6px;
}
.reward__seal { margin: 0 auto 16px; }
.reward__prize {
  font-family: var(--ff-display); font-weight: 800; font-size: 28px; color: var(--rose-d);
  margin: 10px 0;
}
.reward__countdown {
  font-size: 13px; color: var(--ink-2); margin: 14px 0;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px; background: var(--paper-2);
}
.reward__countdown .num { color: var(--rose-d); font-size: 16px; }

.toast {
  position: absolute; left: 50%; bottom: 96px;
  transform: translate(-50%, 20px);
  background: rgba(43,35,30,.95);
  color: var(--paper);
  padding: 11px 20px; border-radius: 24px;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  opacity: 0; pointer-events: none; z-index: 90;
  transition: opacity .25s var(--ease), transform .25s var(--ease);
  box-shadow: 0 10px 24px -8px rgba(0,0,0,.4);
  white-space: nowrap;
}
.toast svg { width: 16px; height: 16px; }
.toast.is-show { opacity: 1; transform: translate(-50%, 0); }
.toast__ico-ok { color: #8ED081; }
.toast__ico-info { color: var(--gold-l); }

.loader {
  position: absolute; inset: 0; z-index: 85;
  background: rgba(250,244,232,.96);
  display: none; align-items: center; justify-content: center;
}
.loader.is-open { display: flex; }
.loader__inner { text-align: center; }
.loader__seal { margin: 0 auto 22px; animation: sealPress .8s var(--ease) infinite alternate; }
.loader__text {
  font-family: var(--ff-serif); font-weight: 700; font-size: 16px;
  color: var(--ink); margin-bottom: 18px;
}
.loader__bar {
  width: 180px; height: 4px; border-radius: 4px;
  background: var(--paper-3); overflow: hidden; margin: 0 auto;
}
.loader__bar i {
  display: block; height: 100%; width: 40%;
  background: linear-gradient(90deg, var(--gold), var(--rose));
  border-radius: 4px;
  animation: loadSlide 1.1s var(--ease) infinite;
}

/* 插屏广告模拟 */
.interstitial {
  text-align: center; padding: 20px 0;
}
.interstitial__visual {
  height: 160px; border-radius: var(--r-md); margin-bottom: 16px;
  background:
    radial-gradient(circle at 30% 30%, var(--rose-l), transparent 60%),
    radial-gradient(circle at 70% 70%, var(--gold-l), transparent 60%),
    linear-gradient(135deg, var(--rose-bg), var(--gold-bg));
  display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.interstitial__visual span {
  font-family: var(--ff-display); font-weight: 800; font-size: 22px;
  color: var(--rose-d); letter-spacing: .02em;
}
.interstitial__skip {
  position: absolute; top: 8px; right: 8px;
  font-size: 11px; color: var(--ink-2);
  background: rgba(255,255,255,.7); padding: 3px 9px; border-radius: 10px;
}
.interstitial__cta { font-size: 13px; color: var(--ink-2); margin-bottom: 16px; }

/* ============================================================
   动画
   ============================================================ */
@keyframes cardRise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
@keyframes sealPress { from { transform: rotate(-8deg) scale(.7); opacity: .4; } to { transform: rotate(-8deg) scale(1); opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes loadSlide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }

/* 响应式：窄屏隐藏左右说明 */
@media (max-width: 1080px) {
  .stage { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
  .stage__meta, .stage__legend { display: none; }
}
@media (max-width: 440px) {
  body { align-items: stretch; }
  .phone { width: 100%; height: 100vh; border-radius: 0; padding: 0; }
  .phone__screen { border-radius: 0; }
  .phone__island { display: none; }
  .statusbar { padding-top: max(14px, env(safe-area-inset-top)); }
}

</style>
</head>

  <script>
/* ============================================================
   AIGift 原型 · 模拟数据与字典
   ============================================================ */

/* 头像配色（暖色系） */
const AVATAR_COLORS = [
  ["#B23A4E", "#8C2838"],

];

/* 字典（用于表单选项） */
const DICT = {
  relationship: [
    "恋人", "配偶", "父母", "子女", "兄弟姐妹", "长辈亲戚",

  ],
  gender: ["男", "女", "其他"],

      return fallback;

  function buildUserPrompt(formData, feedbackSummary) {

    if (formData.lifeStage) parts.push(`- 人生阶段：${formData.lifeStage}`);
    if (formData.personality && formData.personality.length) parts.push(`- 性格标签：${formData.personality.join("、")}`);
    if (formData.hobbies && formData.hobbies.length) parts.push(`- 兴趣爱好：${formData.hobbies.join("、")}`);

    if (formData.taboos) parts.push(`- ⚠️ 禁忌/雷区：${formData.taboos}`);

    parts.push("\n## 送礼场景");
    if (formData.occasion) parts.push(`- 送礼场合：${formData.occasion}`);

    if (formData.giftType && formData.giftType.length) parts.push(`- 期望礼物类型：${formData.giftType.join("、")}`);
    if (formData.delivery) parts.push(`- 送达方式：${formData.delivery}`);

    if (formData.personalIdea) parts.push(`\n## 个人想法\n${formData.personalIdea}`);

  function buildFeedbackSummary(recipientId) {
    const pastRecs = state.history.filter(h => h.recipientId === recipientId);
    if (!pastRecs.length) return null;
    const accepted = [];
    const rejected = [];
    pastRecs.forEach(h => {
      h.items.forEach(it => {
        if (it.status === "accepted") accepted.push(it.name);
        else if (it.status === "rejected") rejected.push(it.name);
      });
    });
    const parts = [];
    if (accepted.length) parts.push(`之前采纳过的礼物：${accepted.join("、")}（请避免重复推荐）`);
    if (rejected.length) parts.push(`之前未采纳的礼物：${rejected.join("、")}（请避免推荐类似的）`);
    return parts.length ? parts.join("\n") : null;
  }

  function parseDeepSeekResponse(content) {
    if (!content) return null;
    let cleaned = content.trim();
    // 去除 markdown code fence
    if (cleaned.startsWith("```")) {
      cleaned = cleaned.replace(/^```(?:json)?\s*\n?/, "").replace(/\n?```\s*$/, "");
    }
    // 尝试提取 JSON
    const jsonStart = cleaned.indexOf("{");
    const jsonEnd = cleaned.lastIndexOf("}");
    if (jsonStart >= 0 && jsonEnd > jsonStart) {
      cleaned = cleaned.substring(jsonStart, jsonEnd + 1);
    }
    try {
      const parsed = JSON.parse(cleaned);
      if (parsed.results && Array.isArray(parsed.results)) {
        return parsed.results.map(g => ({
          name: g.name || "未知礼物",
          reason: g.reason || "这是一份用心的推荐",
          priceRange: g.priceRange || budgetText(state.form.budget),
          purchaseHint: g.purchaseHint || "可在电商平台搜索购买",
          tags: Array.isArray(g.tags) ? g.tags : ["推荐"],
          matchScore: typeof g.matchScore === "number" ? g.matchScore : 75,
        }));
      }
    } catch (e) {
      console.warn("JSON parse error:", e);
    }
    return null;
  }

  async function callDeepSeek(formData, feedbackSummary) {
    const apiKey = getApiKey();
    if (!apiKey) throw new Error("未配置 DeepSeek API Key");
    const systemPrompt = buildSystemPrompt();
    const userPrompt = buildUserPrompt(formData, feedbackSummary);

    const response = await fetch(DEEPSEEK_API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`,
      },
      body: JSON.stringify({
        model: DEEPSEEK_MODEL,
        messages: [
          { role: "system", content: systemPrompt },
          { role: "user", content: userPrompt },
        ],
        response_format: { type: "json_object" },
        max_tokens: 2000,
        temperature: 0.8,
      }),
    });

    if (!response.ok) {
      const errText = await response.text().catch(() => "");
      throw new Error(`DeepSeek API ${response.status}: ${errText}`);
    }

    const data = await response.json();
    const content = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    const results = parseDeepSeekResponse(content);
    if (!results || results.length === 0) {
      throw new Error("AI 返回数据解析失败");
    }
    return results;
  }

  /* ---------- 完整度计算 ---------- */
  function computeCompleteness() {
    const f = state.form;
    const reqFilled = REQUIRED.filter(k => {
      const v = f[k];
      return v !== "" && !(Array.isArray(v) && v.length === 0);
    }).length;
    const optFilled = OPTIONAL_FIELDS.filter(k => {
      const v = f[k];
      return v !== "" && !(Array.isArray(v) && v.length === 0);
    }).length;
    const pct = Math.round((reqFilled / REQUIRED.length) * 42 + (optFilled / OPTIONAL_FIELDS.length) * 58);
    const tier = pct >= 85 ? 2 : pct >= 60 ? 1 : 0;
    return { pct: Math.min(100, pct), tier, reqMissing: REQUIRED.length - reqFilled };
  }

  function refreshCompleteness() {
    const { pct, tier, reqMissing } = computeCompleteness();
    const bar = $("#compFill");
    const pctEl = $("#compPct");
    const badge = $("#compBadge");
    const hint = $("#compHint");
    const genBtn = $("#genBtn");
    if (!bar) return;
    bar.style.width = pct + "%";
    pctEl.textContent = pct + "%";
    badge.setAttribute("data-tier", tier);
    badge.innerHTML = `<span class="dot"></span>${tier === 2 ? "高精准推荐 🌟" : tier === 1 ? "精准推荐 ✨" : "标准推荐"}`;
    if (reqMissing > 0) {
      hint.innerHTML = `还差 <b style="color:var(--rose-d)">${reqMissing}</b> 个必填项即可生成 · 填越多越准`;
      if (genBtn) genBtn.disabled = true;
    } else {
      const remain = 100 - pct;
      hint.innerHTML = remain > 10
        ? `信息越完整，推荐越精准 · 再填几项可达高精准 <span style="color:var(--gold-d)">↑</span>`
        : `完美！信息非常充分，将获得高精准推荐 🌟`;
      if (genBtn) genBtn.disabled = state.quota <= 0 && state.route === "recommend";
    }
    const range = $("#budgetRange");
    if (range) {
      const p = ((state.form.budget - 0) / 1000) * 100;
      range.style.setProperty("--p", p + "%");
    }
  }

  /* ============================================================
     本地礼物池兜底逻辑（AI 失败时使用）
     ============================================================ */
  function budgetBand(v) {
    if (v <= 50) return { min: 0, max: 50 };
    if (v <= 100) return { min: 50, max: 100 };
    if (v <= 300) return { min: 100, max: 300 };
    if (v <= 500) return { min: 300, max: 500 };
    if (v <= 1000) return { min: 500, max: 1000 };
    return { min: 1000, max: 3000 };
  }

  function generateResultsLocal() {
    const f = state.form;
    const band = budgetBand(f.budget);
    const count = f.count || 5;
    const fitTokens = [...(f.personality || []), ...(f.hobbies || []), ...(f.materialPrefs || [])];
    const typeFilter = (f.giftType || []).filter(t => t !== "不限");

    let pool = GIFT_POOL.filter(g => {
      if (typeFilter.length && !g.types.some(t => typeFilter.includes(t))) return false;
      if (g.max < band.min * 0.6 || g.min > band.max * 1.4) return false;
      if (g.gender && f.gender && g.gender !== f.gender) return false;
      if (g.age && f.ageRange && !g.age.includes(f.ageRange)) return false;
      if (f.taboos && /甜食|坚果/.test(f.taboos) && /食品|零食|糕点/.test(g.name)) return false;
      return true;
    });

    const scored = pool.map(g => {
      let s = 64 + Math.floor(Math.random() * 6);
      g.fit.forEach(t => { if (fitTokens.includes(t)) s += 9; });
      return { ...g, _score: Math.min(98, s) };
    }).sort((a, b) => b._score - a._score);

    let picks = scored.slice(0, count);
    if (picks.length < count) {
      const used = new Set(picks.map(p => p.name));
      GIFT_POOL.forEach(g => {
        if (picks.length >= count) return;
        if (used.has(g.name)) return;
        if (g.gender && f.gender && g.gender !== f.gender) return;
        picks.push({ ...g, _score: 68 + Math.floor(Math.random() * 12) });
        used.add(g.name);
      });
    }

    return picks.map(g => {
      const lo = Math.max(g.min, Math.floor(band.min * 0.8));
      const hi = Math.min(g.max, Math.ceil(band.max * 1.1));
      const hints = ["京东 / 天猫", "线下精品店", "品牌官方定制", "小红书好物馆", "线下商场"];
      return {
        name: g.name,
        matchScore: g._score,
        priceRange: `¥${lo} – ${hi}`,
        purchaseHint: hints[Math.floor(Math.random() * hints.length)],
        tags: g.tags,
        reason: buildReasonLocal(g, f),
      };
    });
  }

  function buildReasonLocal(g, f) {
    const parts = [];
    const rel = f.relationship;
    const occ = f.occasion || "送礼";
    if (rel && /恋人|配偶|恋爱/.test(rel)) {
      parts.push(`考虑到你们是${rel}关系，${occ}这样的时刻最适合传递心意，`);
    } else if (rel) {
      parts.push(`送给${rel}的${occ}礼物，讲究的是得体与贴心，`);
    } else {
      parts.push(`这份${occ}礼物，`);
    }
    if (f.personality && f.personality.length) {
      parts.push(`结合 TA「${f.personality.slice(0, 2).join("、")}」的性格，`);
    }
    if (f.hobbies && f.hobbies.length) {
      parts.push(`以及 TA 对「${f.hobbies.slice(0, 2).join("、")}」的热爱，`);
    }
    if (g.tags.includes("实用")) parts.push(`这款实用又日常，能被高频使用；`);
    else if (g.tags.includes("仪式感") || g.tags.includes("浪漫")) parts.push(`这款自带仪式感，足以制造一个难忘的瞬间；`);
    else if (g.tags.includes("品质") || g.tags.includes("品牌")) parts.push(`品质与品牌兼顾，送出手有分量；`);
    else if (g.tags.includes("创意")) parts.push(`独特而有创意，能体现你的用心；`);
    if (f.taboos) parts.push(`并已为你规避了 TA 的忌讳。`);
    else parts.push(`价位也贴合你的预算。`);
    return parts.join("");
  }

  /* ============================================================
     生成推荐（AI + 本地兜底）
     ============================================================ */
  async function handleGenerate() {
    const { reqMissing } = computeCompleteness();
    if (reqMissing > 0) {
      toast(`还差 ${reqMissing} 个必填项`);
      return;
    }
    if (state.quota <= 0) {
      openReward(true);
      return;
    }
    // Key 缺失：先引导输入（本机保存），输入成功后继续本次生成
    if (!getApiKey()) {
      openApiKeyModal(() => handleGenerate());
      return;
    }

    // 扣减额度
    state.quota -= 1;
    state.totalGenerated += 1;
    addFlow("use", `生成推荐 · ${state.form.name || "对象"}`, -1);
    persistQuota();
    persistFlow();
    persistStats();
    updateQuotaUI();

    // 显示 loader
    showLoader("正在分析 TA 的画像…");
    startLoaderAnimation();

    // 记录当前的表单快照（用于写入历史）
    const formSnapshot = { ...state.form };
    const recipientId = state.currentRecipientId;
    const recipientName = state.form.name || "TA";
    const feedbackSummary = recipientId ? buildFeedbackSummary(recipientId) : null;

    try {
      const results = await callDeepSeek(formSnapshot, feedbackSummary);
      state.lastResults = results;
      state.lastFeedback = {};
      state.lastResultContext = {
        recipientId,
        recipientName,
        occasion: formSnapshot.occasion,
        budget: formSnapshot.budget,
        formSnapshot,
      };
      hideLoader();
      renderResult();
      openResult();
      state.interstitialCount += 1;
      if (state.interstitialCount > 1 && state.interstitialCount <= 3) {
        setTimeout(openInterstitial, 600);
      }
      updateQuotaUI();
    } catch (err) {
      console.error("DeepSeek API error:", err);
      hideLoader();
      // 本地兜底
      toast("AI 服务暂不可用，使用本地推荐", "info");
      const results = generateResultsLocal();
      state.lastResults = results;
      state.lastFeedback = {};
      state.lastResultContext = {
        recipientId,
        recipientName,
        occasion: formSnapshot.occasion,
        budget: formSnapshot.budget,
        formSnapshot,
      };
      renderResult();
      openResult();
      updateQuotaUI();
    }
  }

     ============================================================ */
  function saveResultsToHistory() {
    if (!state.lastResults || state.lastResults.length === 0) return;
    if (!state.lastResultContext) return;

    const ctx = state.lastResultContext;
    const now = new Date();
    const dateStr = String(now.getMonth() + 1).padStart(2, "0") + "-" + String(now.getDate()).padStart(2, "0");

    const items = state.lastResults.map((g, i) => {
      const fb = state.lastFeedback[i];
      return {
        name: g.name,
        status: fb === "accepted" ? "accepted" : fb === "rejected" ? "rejected" : "pending",
      };
    });

    const historyEntry = {
      recipientId: ctx.recipientId,
      recipientName: ctx.recipientName,
      date: dateStr,
      occasion: ctx.occasion || "送礼",
      budget: ctx.budget || 300,
      items,
    };

    state.history = [historyEntry, ...state.history];
    persistHistory();
    state.lastResults = null;
    state.lastResultContext = null;
    state.lastFeedback = {};
  }

  function recipientCompleteness(r) {
    let filled = 0, total = 0;
    ["name", "gender", "ageRange", "relationship", "closeness", "occupation", "lifeStage", "diet", "living", "taboos"].forEach(k => {
      total++; if (r[k]) filled++;

    return Math.round((filled / total) * 100);
  }

    openModal(`
      <div class="sheet__handle"></div>
      <div class="sheet__title">分享给好友</div>
      <div class="sheet__sub">TA 首次进入小程序，你即可获得 <b style="color:var(--rose-d)">+2 次</b> 额度</div>
      <div style="display:flex;gap:10px;margin:18px 0">
        <button class="btn btn--ghost btn--block btn--sm" data-action="close-modal">${ICO.msg}微信好友</button>
        <button class="btn btn--ghost btn--block btn--sm" data-action="close-modal">生成卡片</button>
      </div>
      <button class="btn btn--primary btn--block" data-action="share-done">${ICO.share}模拟分享成功 +2</button>
    `);
  }

  function shareDone() {
    state.quota += 2;
    addFlow("add", "分享好友奖励", 2);
    persistQuota();
    persistFlow();
    updateQuotaUI();
    closeModal();
    toast("已到账 +2 次额度", "ok");
  }

  function openInterstitial() {
    openModal(`
      <div class="interstitial">
        <div class="interstitial__visual">
          <span>专属好物 · 限时优惠</span>
          <span class="interstitial__skip">跳过 3</span>
        </div>
        <div class="interstitial__cta">— 插屏广告位（频控：首次推荐不插）—</div>
        <button class="btn btn--ghost btn--block btn--sm" data-action="close-modal">关闭广告</button>
      </div>
    `);
    let n = 3;
    const skip = $(".interstitial__skip");
    const t = setInterval(() => {
      n -= 1;
      if (n <= 0) { clearInterval(t); }
      else if (skip) skip.textContent = `跳过 ${n}`;
    }, 1000);
  }

  /* ---------- 新建对象（完整字段） ---------- */
  function openNewRecipient() {
    const seg = (field, options, multi = false) => options.map(o =>
      `<button class="seg__btn" data-nr-seg="${field}" data-val="${o}" data-multi="${multi}">${multi ? '<span class="check">' + ICO.check + '</span>' : ''}${o}</button>`).join("");

    openModal(`
      <div class="sheet__handle"></div>
      <div class="sheet__title">新建送礼对象</div>
      <div class="sheet__sub">填写越多，未来推荐越准</div>

      <div class="field" style="margin-top:14px">
        <div class="field__label"><span class="req">*</span>昵称</div>
        <input class="input" id="nr_name" placeholder="如：老张、妹妹" />
      </div>
      <div class="field"><div class="field__label"><span class="req">*</span>关系</div><div class="seg">${seg("nr_relationship", DICT.relationship)}</div></div>
      <div class="field"><div class="field__label"><span class="req">*</span>性别</div><div class="seg">${seg("nr_gender", DICT.gender)}</div></div>
      <div class="field"><div class="field__label"><span class="req">*</span>年龄段</div><div class="seg">${seg("nr_ageRange", DICT.ageRange)}</div></div>
      <div class="field"><div class="field__label">亲密程度</div><div class="seg">${seg("nr_closeness", DICT.closeness)}</div></div>
      <div class="field"><div class="field__label">职业 / 身份</div><input class="input" id="nr_occupation" placeholder="如：产品经理、学生" /></div>
      <div class="field"><div class="field__label">人生阶段</div><div class="seg">${seg("nr_lifeStage", DICT.lifeStage)}</div></div>
      <div class="field"><div class="field__label">性格标签（可多选）</div><div class="seg seg--multi">${seg("nr_personality", DICT.personality, true)}</div></div>
      <div class="field"><div class="field__label">兴趣爱好（可多选）</div><div class="seg seg--multi">${seg("nr_hobbies", DICT.hobbies, true)}</div></div>
      <div class="field"><div class="field__label">物质偏好（可多选）</div><div class="seg seg--multi">${seg("nr_materialPrefs", DICT.materialPrefs, true)}</div></div>
      <div class="field"><div class="field__label">饮食禁忌</div><div class="seg">${seg("nr_diet", DICT.diet)}</div></div>
      <div class="field"><div class="field__label">居住情况</div><div class="seg">${seg("nr_living", DICT.living)}</div></div>
      <div class="field"><div class="field__label">⚠️ 禁忌 / 雷区</div><textarea class="textarea" id="nr_taboos" placeholder="颜色 / 数字 / 寓意 / 品类"></textarea></div>

      <button class="btn btn--primary btn--block" data-action="save-recipient">${ICO.check}保存对象</button>
    `);

    state.nrDraft = {
      nr_name: "", nr_relationship: "", nr_gender: "", nr_ageRange: "",
      nr_closeness: "", nr_occupation: "", nr_lifeStage: "",
      nr_personality: [], nr_hobbies: [], nr_materialPrefs: [],
      nr_diet: "", nr_living: "", nr_taboos: "",
    };
  }

  function saveRecipient() {
    const d = state.nrDraft;
    if (!d.nr_name || !d.nr_relationship || !d.nr_gender || !d.nr_ageRange) {
      toast("请完成必填项");
      return;
    }
    const id = "r_" + Date.now().toString(36);
    const initial = d.nr_name.slice(0, 1);
    state.recipients = [{
      id,
      name: d.nr_name,
      initial,
      gender: d.nr_gender,
      ageRange: d.nr_ageRange,
      relationship: d.nr_relationship,
      closeness: d.nr_closeness || "",
      occupation: d.nr_occupation || "",
      lifeStage: d.nr_lifeStage || "",
      personality: d.nr_personality || [],
      hobbies: d.nr_hobbies || [],
      materialPrefs: d.nr_materialPrefs || [],
      diet: d.nr_diet || "",
      living: d.nr_living || "",
      taboos: d.nr_taboos || "",
      importantDates: [],
      colorIdx: state.recipients.length,
    }, ...state.recipients];
    persistRecipients();
    closeModal();
    toast("对象已创建", "ok");
    if (state.route === "recipients") renderRecipients();
    else { go("recommend"); setTimeout(() => selectRecipient(id), 60); }
  }

  /* ---------- 额度 / 流水 ---------- */
  function addFlow(type, title, amt) {
    state.flow = [{ type, title, time: "刚刚", amt }, ...state.flow].slice(0, 12);
  }
  function updateQuotaUI() {
    const n = $("#quotaNum");
    if (n) n.textContent = state.quota;
    refreshCompleteness();
  }

  /* ============================================================
     事件分发
     ============================================================ */
  const app = $("#app");

  // 点击委托
  app.addEventListener("click", e => {
    const tab = e.target.closest(".tab");
    if (tab) { go(tab.dataset.tab); return; }

    const actEl = e.target.closest("[data-action]");
    if (!actEl) return;
    const a = actEl.dataset.action;

    switch (a) {
      case "go-recipients": go("recipients"); break;
      case "open-reward": openReward(false); break;
      case "watch-video": watchVideo(); break;
      case "open-share": openShare(); break;
      case "share-done": shareDone(); break;
      case "select-recipient": selectRecipient(actEl.dataset.id); break;
      case "select-recipient-from-list": selectRecipientFromList(actEl.dataset.id); break;
      case "new-recipient": openNewRecipient(); break;
      case "apply-template": applyTemplate(actEl.dataset.key); break;
      case "generate": handleGenerate(); break;
      case "feedback": handleFeedback(+actEl.dataset.idx, actEl.dataset.kind); break;
      case "regenerate":
        // 先保存上一批结果到历史
        saveResultsToHistory();
        handleGenerate();
        break;
      case "close-result":
        saveResultsToHistory();
        closeResult();
        break;
      case "close-modal": closeModal(); break;
      case "reuse-history": {
        const id = actEl.dataset.id;
        go("recommend");
        if (id) setTimeout(() => selectRecipient(id), 60);
        toast("已载入对象画像，可重新生成推荐", "ok");
        break;
      }
      case "save-recipient": saveRecipient(); break;
      case "save-apikey": saveApiKey(); break;
      case "toast-nav": toast("原型演示：此入口已规划"); break;
    }
  });

  // 文本/范围输入
  app.addEventListener("input", e => {
    const el = e.target;
    if (el.dataset.field) {
      const val = el.type === "range" ? +el.value : el.value;
      state.form[el.dataset.field] = val;
      if (el.dataset.field === "budget") {
        $("#budgetVal").textContent = budgetText(val);
        el.style.setProperty("--p", ((val / 1000) * 100) + "%");
      }
      refreshCompleteness();
    }
    // 新建对象模态中的输入
    if (el.id === "nrName" || (el.id && el.id.startsWith("nr_"))) {
      if (el.tagName === "INPUT" || el.tagName === "TEXTAREA") {
        state.nrDraft[el.id] = el.value;
      }
    }
  });

  // 段选择 / 多选
  app.addEventListener("click", e => {
    const segEl = e.target.closest("[data-seg]");
    if (segEl) {
      const field = segEl.dataset.seg;
      const val = segEl.dataset.val;
      const multi = segEl.dataset.multi === "true";
      if (field === "count") state.form.count = +val;
      else if (multi) {
        const arr = state.form[field] || [];
        const i = arr.indexOf(val);
        if (i >= 0) arr.splice(i, 1); else arr.push(val);
        state.form[field] = arr;
      } else {
        state.form[field] = state.form[field] === val ? "" : val;
      }
      renderRecommend();
      return;
    }
    // 新建对象模态内段选择
    const nrSeg = e.target.closest("[data-nr-seg]");
    if (nrSeg) {
      const field = nrSeg.dataset.nrSeg; // e.g. "nr_relationship"
      const val = nrSeg.dataset.val;
      const multi = nrSeg.dataset.multi === "true";
      if (multi) {
        const arr = state.nrDraft[field] || [];
        const i = arr.indexOf(val);
        if (i >= 0) arr.splice(i, 1); else arr.push(val);
        state.nrDraft[field] = arr;
      } else {
        state.nrDraft[field] = state.nrDraft[field] === val ? "" : val;
      }
      $$(`[data-nr-seg="${field}"]`).forEach(b => {
        const on = multi ? (state.nrDraft[field] || []).includes(b.dataset.val) : state.nrDraft[field] === b.dataset.val;
        b.setAttribute("data-active", on);
        if (multi) {
          if (on) {
            b.style.background = "var(--rose-bg)";
            b.style.color = "var(--rose-d)";
            b.style.borderColor = "var(--rose-l)";
          } else {
            b.style.background = "";
            b.style.color = "";
            b.style.borderColor = "";
          }
        }
      });
    }
  });

  /* ---------- 初始化 ---------- */
  function renderGenerateDock() {
    let dock = $("#genDock");
    if (!dock) {
      dock = document.createElement("div");
      dock.id = "genDock";
      dock.className = "generate-dock";
      dock.innerHTML = `<button class="btn btn--primary btn--block" id="genBtn" data-action="generate">${ICO.sparkle}生成 AI 推荐</button>`;
      $("#app").appendChild(dock);
    }
  }

  function init() {
    // 状态栏时间
    $("#statusTime").textContent = (() => {
      const d = new Date();
      return d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
    })();

    renderRecommend();
    renderGenerateDock();
    go("recommend");

    // 每日登录奖励（模拟）
    setTimeout(() => {
      if (!state.dailyClaimed) {
        state.dailyClaimed = true;
        state.quota += 1;
        addFlow("add", "每日登录奖励", 1);
        persistQuota();
        persistFlow();
        persistDailyClaimed();
        updateQuotaUI();
        toast("每日登录 +1 次额度", "ok");
      }
    }, 1400);
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
